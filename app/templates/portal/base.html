<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14324f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="{{ prefix }}/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="{{ prefix }}/static/icon-192.png">
  <title>{% block title %}{{ t("portal.brand") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ prefix }}/static/style.css">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("{{ prefix }}/sw.js");
    }
  </script>
</head>
<body>
<nav class="nav">
  <span class="brand">{{ t("portal.brand") }}</span>
  <a href="{{ prefix }}/owner-portal">{{ t("portal.home") }}</a>
  <span class="lang-switch">
    <a href="{{ prefix }}/set-language/es?next={{ request.scope.path }}">ES</a> |
    <a href="{{ prefix }}/set-language/en?next={{ request.scope.path }}">EN</a> |
    <a href="{{ prefix }}/set-language/zh?next={{ request.scope.path }}">中文</a>
  </span>
  <form method="post" action="{{ prefix }}/logout" class="inline">
    <button type="submit" class="link">{{ t("portal.logout") }}</button>
  </form>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
