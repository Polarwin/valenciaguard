<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ValenciaGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ prefix }}/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<nav class="nav">
  <span class="brand">ValenciaGuard</span>
  <a href="{{ prefix }}/dashboard">{{ t("nav.dashboard") }}</a>
  <a href="{{ prefix }}/properties">{{ t("nav.properties") }}</a>
  <a href="{{ prefix }}/calendar">{{ t("nav.calendar") }}</a>
  <a href="{{ prefix }}/owners">{{ t("nav.owners") }}</a>
  <a href="{{ prefix }}/users">{{ t("nav.users") }}</a>
  <a href="{{ prefix }}/rent/calculator">{{ t("nav.rent_calculator") }}</a>
  <a href="{{ prefix }}/ai-assistant">{{ t("nav.ai_assistant") }}</a>
  <a href="{{ prefix }}/settings">{{ t("nav.settings") }}</a>
  <span class="lang-switch">
    <a href="{{ prefix }}/set-language/es?next={{ request.scope.path }}">ES</a> |
    <a href="{{ prefix }}/set-language/en?next={{ request.scope.path }}">EN</a> |
    <a href="{{ prefix }}/set-language/zh?next={{ request.scope.path }}">中文</a>
  </span>
  <form method="post" action="{{ prefix }}/logout" class="inline">
    <button type="submit" class="link">{{ t("nav.logout") }}</button>
  </form>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
