<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValenciaGuard — Acceso</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
<main class="login-box">
  <h1>ValenciaGuard</h1>
  <p class="muted">Gestión de propiedades — Valencia</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
    <label>Usuario <input name="username" required autofocus></label>
    <label>Contraseña <input name="password" type="password" required></label>
    <button type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
