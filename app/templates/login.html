<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValenciaGuard</title>
  <link rel="stylesheet" href="{{ prefix }}/static/style.css">
</head>
<body class="login-page">
<main class="login-box">
  <h1>ValenciaGuard</h1>
  <p class="muted">{{ t("auth.subtitle") }}</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ prefix }}/login">
    <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
    <label>{{ t("auth.username") }} <input name="username" required autofocus></label>
    <label>{{ t("auth.password") }} <input name="password" type="password" required></label>
    <button type="submit">{{ t("auth.submit") }}</button>
  </form>
  <p class="lang-switch-login">
    <a href="{{ prefix }}/set-language/es?next={{ request.scope.path }}">ES</a> |
    <a href="{{ prefix }}/set-language/en?next={{ request.scope.path }}">EN</a> |
    <a href="{{ prefix }}/set-language/zh?next={{ request.scope.path }}">中文</a>
  </p>
</main>
</body>
</html>
