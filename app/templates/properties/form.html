{% extends "base.html" %}
{% block content %}
<h1>{{ 'Editar propiedad' if prop else 'Nueva propiedad' }}</h1>
<form method="post" action="{{ '/properties/' ~ prop.id ~ '/edit' if prop else '/properties' }}" class="form">
  <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
  <label>Dirección <input name="address" required value="{{ prop.address if prop else '' }}"></label>
  <label>Ciudad <input name="city" value="{{ prop.city if prop else 'Valencia' }}"></label>
  <label>Código postal <input name="postal_code" value="{{ prop.postal_code if prop else '' }}"></label>
  <label>Propietario
    <select name="owner_id">
      {% for o in owners %}
      <option value="{{ o.id }}" {{ 'selected' if prop and prop.owner_id == o.id }}>{{ o.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Fecha de compra <input type="date" name="purchase_date" value="{{ prop.purchase_date if prop and prop.purchase_date else '' }}"></label>
  <label>Precio de compra (€) <input type="number" step="0.01" name="purchase_price" value="{{ prop.purchase_price if prop and prop.purchase_price is not none else '' }}"></label>
  <label>Valor estimado actual (€) <input type="number" step="0.01" name="current_value_estimate" value="{{ prop.current_value_estimate if prop and prop.current_value_estimate is not none else '' }}"></label>
  <label>Estado
    <select name="status">
      {% for s in ['occupied', 'vacant', 'pending_handover'] %}
      <option value="{{ s }}" {{ 'selected' if prop and prop.status == s }}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Guardar</button>
</form>
{% endblock %}
