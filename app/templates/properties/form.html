{% extends "base.html" %}
{% block content %}
<h1>{{ t("props.edit_title") if prop else t("props.new_title") }}</h1>
<form method="post" action="{{ prefix ~ '/properties/' ~ prop.id ~ '/edit' if prop else prefix ~ '/properties' }}" class="form">
  <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
  <label>{{ t("props.address") }} <input name="address" required value="{{ prop.address if prop else '' }}"></label>
  <label>{{ t("props.city") }} <input name="city" value="{{ prop.city if prop else 'Valencia' }}"></label>
  <label>{{ t("props.postal_code") }} <input name="postal_code" value="{{ prop.postal_code if prop else '' }}"></label>
  <label>{{ t("props.owner") }}
    <select name="owner_id">
      {% for o in owners %}
      <option value="{{ o.id }}" {{ 'selected' if prop and prop.owner_id == o.id }}>{{ o.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>{{ t("props.purchase_date") }} <input type="date" name="purchase_date" value="{{ prop.purchase_date if prop and prop.purchase_date else '' }}"></label>
  <label>{{ t("props.purchase_price") }} <input type="number" step="0.01" name="purchase_price" value="{{ prop.purchase_price if prop and prop.purchase_price is not none else '' }}"></label>
  <label>{{ t("props.value_estimate") }} <input type="number" step="0.01" name="current_value_estimate" value="{{ prop.current_value_estimate if prop and prop.current_value_estimate is not none else '' }}"></label>
  <label>{{ t("props.status") }}
    <select name="status">
      {% for s in ['occupied', 'vacant', 'pending_handover'] %}
      <option value="{{ s }}" {{ 'selected' if prop and prop.status == s }}>{{ t("status." ~ s) }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">{{ t("common.save") }}</button>
</form>
{% endblock %}
