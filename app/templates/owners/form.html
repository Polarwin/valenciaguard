{% extends "base.html" %}
{% block content %}
<h1>{{ t("owners.new_title") }}</h1>
<form method="post" action="{{ prefix }}/owners" class="form">
  <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
  <label>{{ t("owners.name") }} <input name="name" required></label>
  <label>Email <input name="email" type="email"></label>
  <label>{{ t("owners.phone") }} <input name="phone"></label>
  <label>WeChat <input name="wechat"></label>
  <label>{{ t("owners.notes") }} <textarea name="notes"></textarea></label>
  <fieldset>
    <legend>{{ t("owners.portal_account") }}</legend>
    <label>{{ t("owners.username") }} <input name="username"></label>
    <label>{{ t("owners.password") }} <input name="password" type="password"></label>
  </fieldset>
  <button type="submit">{{ t("common.save") }}</button>
</form>
{% endblock %}
