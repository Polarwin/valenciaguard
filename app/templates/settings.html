{% extends "base.html" %}
{% block content %}
<h1>Ajustes</h1>
<form method="post" action="/settings" class="form">
  <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
  <label>Nombre de la empresa <input name="company_name" value="{{ company_name }}"></label>
  <label>Email de notificaciones <input name="notify_email" value="{{ notify_email }}"></label>
  <label>Umbral de coste para aprobación (€) <input type="number" step="0.01" name="cost_threshold" value="{{ cost_threshold }}"></label>
  <label>Tasa IRAV <input type="number" step="0.0001" name="irav_rate" value="{{ irav_rate }}"></label>
  <button type="submit">Guardar</button>
</form>

<h2>Registro de auditoría</h2>
<table>
  <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Detalle</th></tr>
  {% for a in audit %}
  <tr>
    <td>{{ a.timestamp.strftime('%Y-%m-%d %H:%M') }}</td>
    <td>{{ a.username }}</td>
    <td>{{ a.action }}</td>
    <td>{{ a.entity }} #{{ a.entity_id }}</td>
    <td>{{ a.detail }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
