{% extends "base.html" %}
{% block content %}
<h1>{{ t("ai.title") }}</h1>
{% if not ai_available %}
<p class="muted">{{ t("ai.mock_notice") }}</p>
{% endif %}
<p class="muted">{{ t("ai.examples") }}</p>
<div id="chat-log"></div>
<form hx-post="{{ prefix }}/api/ai/ask" hx-target="#chat-log" hx-swap="beforeend"
      hx-on::after-request="this.reset()" class="form">
  <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
  <textarea name="question" rows="3" required placeholder="{{ t('ai.placeholder') }}"></textarea>
  <button type="submit">{{ t("ai.ask") }}</button>
</form>
{% endblock %}
