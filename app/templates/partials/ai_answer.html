<div class="chat-turn">
  <p class="chat-q"><strong>{{ t("ai.you") }}</strong> {{ question }}</p>
  <div class="chat-a">
    {% if not ai_available %}<p class="muted">{{ t("ai.mock_tag") }}</p>{% endif %}
    {% if context_used %}<p class="muted">{{ t("ai.context_tag") }}</p>{% endif %}
    <pre class="answer">{{ answer }}</pre>
  </div>
</div>
