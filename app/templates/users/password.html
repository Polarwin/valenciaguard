{% extends "base.html" %}
{% block content %}
<h1>{{ t("users.pw_reset_title") }}</h1>
<div class="panel">
  <p>{{ t("users.pw_reset_text", username=target.username) }}</p>
  <pre class="letter">{{ password }}</pre>

</div>
<p><a href="{{ prefix }}/users">{{ t("users.back") }}</a></p>
{% endblock %}
