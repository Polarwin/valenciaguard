# ValenciaGuard is mounted under the /valenciaguard/ subpath of an existing
# nginx server (alongside sibling apps). Add these blocks to the existing
# server {} — do NOT create a new server block.

location = /valenciaguard { return 301 /valenciaguard/; }
location /valenciaguard/ {
    proxy_pass http://127.0.0.1:8473/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /valenciaguard;
}
